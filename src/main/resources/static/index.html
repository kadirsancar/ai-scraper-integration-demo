<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIPage Asistan</title>
    <!-- Tailwind ve İkonlar -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Markdown desteği için (Yapay zekanın yanıtlarının düzgün ve şık görünmesi için) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Özel CSS'imiz -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="flex h-screen bg-white text-gray-800 font-sans">


<!-- Sol Menü (Sidebar) -->
<div class="w-64 bg-gray-50 border-r border-gray-200 flex flex-col hidden md:flex">
    <div class="p-4">
        <!-- Yeni Sohbet Butonu: Yazı lacivert, ikon kırmızı, hover çerçevesi lacivert -->
        <button onclick="location.reload()" class="w-full flex items-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-2 hover:border-[#2B2E72] hover:bg-gray-50 transition-all font-medium text-[#2B2E72]">
            <i class="fa-solid fa-pen-to-square text-[#E30613]"></i> Yeni sohbet
        </button>
    </div>

    <div class="flex-1 overflow-y-auto no-scrollbar p-4 pt-0">
        <!-- Yetkinlikler Başlığı: Koru Laciverti -->
        <div class="text-xs font-semibold text-[#2B2E72] mb-3 mt-4 uppercase tracking-wide">Yetkinlikler</div>
        <ul class="space-y-1 text-sm text-gray-700">
            <!-- Menü Elemanları: İkonlar kırmızı, üzerine gelince (hover) yazılar lacivert oluyor -->
            <li class="p-2 hover:bg-gray-200 hover:text-[#2B2E72] rounded cursor-pointer flex items-center gap-2 transition-colors"><i class="fa-regular fa-comment text-[#E30613]"></i> Sohbet</li>
            <li class="p-2 hover:bg-gray-200 hover:text-[#2B2E72] rounded cursor-pointer flex items-center gap-2 transition-colors"><i class="fa-regular fa-image text-[#E30613]"></i> Görsel Analizi</li>
            <li class="p-2 hover:bg-gray-200 hover:text-[#2B2E72] rounded cursor-pointer flex items-center gap-2 transition-colors"><i class="fa-regular fa-file-pdf text-[#E30613]"></i> PDF & Evrak Okuma</li>
            <li class="p-2 hover:bg-gray-200 hover:text-[#2B2E72] rounded cursor-pointer flex items-center gap-2 transition-colors"><i class="fa-solid fa-magnifying-glass text-[#E30613]"></i> Teşhis & Kimlik Çıkarıcı</li>
        </ul>
    </div>

    <!-- Kullanıcı Profili (Koru Laciverti) -->
    <div class="p-4 border-t border-gray-200 flex items-center gap-3 hover:bg-gray-100 cursor-pointer transition-colors">
        <div class="w-8 h-8 bg-[#2B2E72] rounded-full flex items-center justify-center text-white font-bold text-sm shadow-sm">K</div>
        <div class="text-sm font-medium text-gray-800">Kadir Sancar<br><span class="text-xs text-gray-500 font-normal">Developer</span></div>
    </div>
</div>


   

<!-- Ana Sohbet Alanı -->
<div class="flex-1 flex flex-col relative h-full">

    <!-- Header (Mobil için) -->
    <div class="md:hidden p-4 border-b flex justify-between items-center bg-white">
        <span class="font-bold text-lg">AIPage</span>
        <i class="fa-solid fa-bars text-xl cursor-pointer"></i>
    </div>


    <!-- Sohbet Geçmişi Alanı (Nefes alma boşluğu pb-48 olarak ayarlandı) -->
    <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 pb-48 flex flex-col">
        <div id="welcomeScreen" class="flex flex-col items-center justify-center h-full mt-20">

            <!-- Koru Sigorta Logosu -->
            <img src="/assets/images/logo.png" alt="Koru Sigorta Logo" class="w-48 mb-6 opacity-40 pointer-events-none">

            <!-- Başlık (Koru Laciverti) -->
            <h1 class="text-2xl md:text-3xl font-semibold mb-8 text-center text-[#2B2E72]">Nasıl yardımcı olabilirim Kadir?</h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl">
                <div class="border rounded-xl p-4 hover:bg-gray-50 cursor-pointer text-sm text-gray-600 flex items-center gap-3">
                    <!-- İkonlar (Koru Kırmızısı) -->
                    <i class="fa-regular fa-image text-[#E30613] text-lg"></i> Görsel Analizi
                </div>
                <div class="border rounded-xl p-4 hover:bg-gray-50 cursor-pointer text-sm text-gray-600 flex items-center gap-3">
                    <i class="fa-solid fa-file-pdf text-[#E30613] text-lg"></i> PDF & Evrak Okuma
                </div>
            </div>
        </div>
    </div>

    <!-- Girdi Alanı (Input) -->
    <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-white via-white to-transparent pt-6 pb-6 px-4 md:px-8">
        <!-- Focus durumu Koru Laciverti -->
        <div class="max-w-4xl mx-auto relative flex items-center bg-gray-100 rounded-2xl p-2 border border-gray-200 shadow-sm focus-within:ring-1 focus-within:ring-[#2B2E72] focus-within:bg-white transition-all">

            <label for="fileUpload" class="p-3 text-gray-500 hover:text-gray-800 cursor-pointer rounded-full hover:bg-gray-200 transition">
                <i class="fa-solid fa-plus text-lg"></i>
            </label>
            <input type="file" id="fileUpload" class="hidden" multiple>

            <input type="text" id="promptInput" class="flex-1 bg-transparent border-none outline-none p-2 text-gray-800 placeholder-gray-500" placeholder="Herhangi bir şey sor...">

            <!-- Gönder Butonu Kırmızı (Koru Kurumsal) Olarak Güncellendi -->
            <button id="sendButton" class="p-3 text-white bg-[#E30613] hover:bg-[#B3040E] cursor-pointer rounded-xl transition ml-2 flex items-center justify-center w-10 h-10">
                <i class="fa-solid fa-arrow-up text-sm"></i>
            </button>
        </div>
        <div class="text-center text-xs text-gray-400 mt-3">AIPage hata yapabilir. Önemli bilgileri kontrol edin.</div>
    </div>
</div>

<!-- Modüler JavaScript Dosyamızın Bağlantısı -->
<script type="module" src="/js/main.js"></script>
</body>
</html>
